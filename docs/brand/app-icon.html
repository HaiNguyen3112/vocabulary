<!doctype html><html><head><meta charset="utf-8">
<!--
  Source of the app icons in public/ (rendered with Chrome, Literata 700 from Google Fonts).
  Open with ?v=any|full|maskable|favicon&size=N and screenshot at N×N with a transparent background:
  logo192/logo512 = any, apple-touch-icon (180) = full, logo-maskable-512 = maskable,
  favicon.ico = favicon rendered at 256 and downscaled to 16/32/48.
-->
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<script>
const p = new URLSearchParams(location.search);
const size = +p.get("size"), variant = p.get("v");
const card = (scale) => `<g transform="translate(256 256) scale(${scale}) translate(-256 -256) rotate(-6 256 256)">
<rect x="96" y="120" width="320" height="272" rx="22" fill="#ffffff"/>
<g stroke="#dfe6f3" stroke-width="6"><line x1="96" y1="196" x2="416" y2="196"/><line x1="96" y1="252" x2="416" y2="252"/><line x1="96" y1="308" x2="416" y2="308"/></g>
<line x1="148" y1="120" x2="148" y2="392" stroke="#f2b8c2" stroke-width="8"/>
<text x="286" y="318" font-family="Literata" font-weight="700" font-size="168" fill="#1d3a8a" text-anchor="middle">Aa</text></g>`;
const bodies = {
  any: `<rect width="512" height="512" rx="112" fill="#1d3a8a"/>${card(1)}`,
  full: `<rect width="512" height="512" fill="#1d3a8a"/>${card(1)}`,
  maskable: `<rect width="512" height="512" fill="#1d3a8a"/>${card(0.84)}`,
  favicon: `<rect width="512" height="512" rx="112" fill="#1d3a8a"/><text x="256" y="372" font-family="Literata" font-weight="700" font-size="380" fill="#ffffff" text-anchor="middle">V</text>`,
};
document.body.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${bodies[variant]}</svg>`;
</script></body></html>
