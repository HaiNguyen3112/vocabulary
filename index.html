<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vocabulary" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#ffffff" />
    <meta name="description" content="Học từ vựng tiếng Anh: ghép từ với nghĩa và quản lý kho từ" />
    <title>Studying Vocabulary</title>
    <script>
      // Apply the colour scheme before first paint (no white flash in dark mode).
      // Key and values mirror src/lib/color-scheme.ts.
      (function () {
        var preference = "system";
        try {
          preference = localStorage.getItem("study-vocabulary:color-scheme") || "system";
        } catch (error) {}
        var isDark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        if (isDark) document.getElementById("theme-color").setAttribute("content", "#161c29");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:wght@500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
